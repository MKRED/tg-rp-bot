# Конфиг edge-nginx для Mini App. Положить на сервере в:
#   /mnt/ssd/dockerdirs/nginx/conf.d/miniapp.aoshi.ru.conf
# затем перезагрузить nginx:  docker exec nginx nginx -s reload
#
# nginx и бот (контейнер kvach_tg_rp_bot) общаются по сети nginx-network,
# поэтому proxy_pass идёт на ИМЯ КОНТЕЙНЕРА, а не на 127.0.0.1 хоста.
# Сертификат miniapp.aoshi.ru уже выпущен; certbot-conf примонтирован в /etc/letsencrypt.

upstream kvach_tg_rp_bot_up {
    zone kvach_tg_rp_bot_up 64k;
    server kvach_tg_rp_bot:3000 resolve;
}

server {
    listen 80;
    server_name miniapp.aoshi.ru;

    # Webroot для продления сертификата certbot'ом.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Остальное — на HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name miniapp.aoshi.ru;

    # TODO: проверить путь — должен совпасть с тем, что выпустил certbot.
    ssl_certificate     /etc/letsencrypt/live/miniapp.aoshi.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/miniapp.aoshi.ru/privkey.pem;

    location / {
        # Бот раздаёт и статику Mini App, и /api — всё одним origin'ом.
        proxy_pass http://kvach_tg_rp_bot_up;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
