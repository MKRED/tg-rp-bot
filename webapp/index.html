<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: клавиатура в Chrome на Android уменьшает окно (и 100dvh), а не
         ложится поверх страницы, — поле ввода чата остаётся над ней. Safari — через visualViewport (shared/viewport). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>RP</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Шрифты Google Fonts подключаются из JS под выбор пользователя (src/shared/theme/fonts.ts);
         preconnect заранее открывает соединения, чтобы шрифт не задерживал первый показ. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
